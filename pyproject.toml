[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-decision-engine"
version = "0.2.0rc3"
description = "Typed numeric decision kernel with System-One local backends"
authors = [{name = "Guilherme Peralta Novaes"}]
requires-python = ">=3.11"
dependencies = []
readme = "PUBLIC_README.md"

[project.scripts]
specter-decision = "specter_decision.cli:main"

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]

[project.urls]
Repository = "https://github.com/aigodsend9-boop/specter-decision-engine"
Issues = "https://github.com/aigodsend9-boop/specter-decision-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["specter_decision*"]

[tool.setuptools.package-data]
specter_decision = ["openapi.json", "py.typed"]
