[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-decision-engine"
version = "0.3.0"
description = "Kernel de decisões tipadas: estado imutável entra, decisões numéricas calibradas saem. Sem geração de texto, sem dependências."
authors = [{name = "Guilherme Peralta Novaes"}]
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
keywords = ["decision", "typed", "calibration", "system-one", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.scripts]
specter-decision = "specter_decision.cli:main"

[project.optional-dependencies]
dev = ["jsonschema>=4.18,<5"]

[project.urls]
Repository = "https://github.com/aigodsend9-boop/specter-decision-engine"
Issues = "https://github.com/aigodsend9-boop/specter-decision-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["specter_decision*"]

[tool.setuptools.package-data]
specter_decision = ["openapi.json", "py.typed"]

[tool.unittest]
start-dir = "tests"
